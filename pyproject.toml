[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratforge"
version = "0.1.1"
description = "Deterministic trading strategies: backtest, compare, promote to paper and live."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "ccxt>=4.5.0",
  "requests>=2.32.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "pyarrow>=17.0.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stratforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
